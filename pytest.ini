[pytest]
# Only the new hermetic suite is collected by default.
# backend/tests/test_sp500_fetch.py hits the live network and swallows its own
# failures (try/except -> return False), so it can never fail under pytest.
# It is deliberately out of testpaths rather than deleted.
testpaths = tests
addopts = -q --strict-markers
markers =
    network: hits a real network service; deselected by default
